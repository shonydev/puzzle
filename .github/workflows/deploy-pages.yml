name: Build and deploy AquaSort to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project into repository root
        run: |
          unzip -oq aquasort-water-puzzle.zip -d .
          rm -f aquasort-water-puzzle.zip
          cat > vite.config.ts <<'EOF'
          import tailwindcss from '@tailwindcss/vite';
          import react from '@vitejs/plugin-react';
          import { fileURLToPath } from 'node:url';
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: '/puzzle/',
            plugins: [react(), tailwindcss()],
            resolve: {
              alias: {
                '@': fileURLToPath(new URL('.', import.meta.url)),
              },
            },
          });
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          html = p.read_text()
          html = re.sub(r'\\s*<script type="module" src="/@vite/client"></script>', '', html)
          html = re.sub(r'<script src="/_aistudio-iframe\\.js[^"]*"></script>', '', html)
          p.write_text(html)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract AquaSort source into repository root"
            git push
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
