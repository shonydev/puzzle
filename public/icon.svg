<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="liquid1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="liquid2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="liquid3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Flask outline & glass body -->
  <g transform="translate(156, 70)">
    <!-- Tube Rim -->
    <rect x="30" y="10" width="140" height="22" rx="11" fill="#cbd5e1" opacity="0.9" stroke="#94a3b8" stroke-width="4" />
    
    <!-- Glass Body Tube -->
    <path d="M 45 32 L 45 300 A 55 55 0 0 0 155 300 L 155 32 Z" fill="rgba(255,255,255,0.08)" stroke="#cbd5e1" stroke-width="8" />

    <!-- Clip path for liquid -->
    <clipPath id="tubeClip">
      <path d="M 49 34 L 49 300 A 51 51 0 0 0 151 300 L 151 34 Z" />
    </clipPath>

    <!-- Liquid layers -->
    <g clip-path="url(#tubeClip)">
      <!-- Bottom Layer: Ruby -->
      <rect x="40" y="240" width="120" height="120" fill="url(#liquid3)" />
      <!-- Middle Layer: Amber -->
      <rect x="40" y="160" width="120" height="80" fill="url(#liquid2)" />
      <!-- Top Layer: Cyan -->
      <rect x="40" y="90" width="120" height="70" fill="url(#liquid1)" />
      
      <!-- Meniscus highlight -->
      <ellipse cx="100" cy="90" rx="48" ry="8" fill="#bae6fd" opacity="0.8" />
      
      <!-- Bubbles -->
      <circle cx="85" cy="120" r="5" fill="#ffffff" opacity="0.6" />
      <circle cx="120" cy="140" r="3.5" fill="#ffffff" opacity="0.5" />
      <circle cx="80" cy="200" r="4.5" fill="#ffffff" opacity="0.5" />
      <circle cx="115" cy="280" r="6" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Glass reflections -->
    <line x1="62" y1="50" x2="62" y2="290" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
